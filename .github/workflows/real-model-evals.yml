name: Real-model evals
# Run by hand from the Actions tab (Run workflow). It calls the real Anthropic API.
on:
  workflow_dispatch:
jobs:
  evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: aporia_evals }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aporia_evals
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APORIA_TEST_MODE: "1"
    steps:
      - name: Check for ANTHROPIC_API_KEY
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Missing ANTHROPIC_API_KEY::These evals call the real Anthropic API. Add an ANTHROPIC_API_KEY repository secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm scenario:build-docs
      - run: pnpm db:migrate
      - run: pnpm evals:nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-runs, path: packages/evals/runs }
