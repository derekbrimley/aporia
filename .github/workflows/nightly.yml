name: Nightly evals
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: aporia_evals }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aporia_evals
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APORIA_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm scenario:build-docs
      - run: pnpm db:migrate
      - run: pnpm evals:nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-runs, path: packages/evals/runs }
