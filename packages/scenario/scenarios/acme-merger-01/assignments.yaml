      keywords: [deemed disclosed, data room, Article 3, preamble, general disclosure]
  socratic_angles:
    - Why the schedules matter when the representations will not survive closing.
    - What Beta can do with an inaccurate schedule before signing.

# ---------------------------------------------------------------- M7
- id: A7
  milestone: M7
  title: Respond to Acme's markup
  deliverable: An email to Simon stating Beta's positions on the open points in Acme's markup, with Daniel copied.
  assigned_by: senior_associate
  feedback_from: senior_associate
  thread_key: negotiation
  expected_recipients: [target_counsel, senior_associate]
  competencies: [merger_agreement, corporate_approvals, regulatory_fda]
  completion: { kind: deliverable }
  approx_minutes: 60
  issues:
    - id: A7.I1
      tier: expected
      title: Keep a consents condition for Halvorsen and Unity
      description: Acme deleted the third-party consents condition. Beta needs at least Halvorsen and Unity, without which the products it is buying cannot be made or sold.
      raised_looks_like: Insists on a closing condition for the Halvorsen and Unity consents and explains why those two matter.
      delta: D01
      competencies: [merger_agreement]
      keywords: [consent, condition, Halvorsen, Unity, 7.2]
    - id: A7.I2
      tier: expected
      title: Written consent right after signing
      description: Acme's markup lets it deliver stockholder consent within five business days with a fiduciary out. Beta needs the written consent, including the Series B class vote, immediately after signing.
      raised_looks_like: Asks for the written consent, including the Series B class vote, within hours of signing and no fiduciary out once delivered.
      delta: D02
      competencies: [corporate_approvals]
      keywords: [written consent, Series B, class vote, fiduciary out, after signing, 6.3]
    - id: A7.I3
      tier: strong
      title: Information and consultation rights on FDA matters
      description: Acme will not commit to spend on remediation, but it can give Beta every FDA communication and agree not to respond to FDA without Beta's review.
      raised_looks_like: Trades the spending covenant for FDA information and consultation rights.
      delta: D03
      competencies: [regulatory_fda, merger_agreement]
      keywords: [FDA, correspondence, consult, review, remediation, covenant, 6.5]
    - id: A7.I4
      tier: strong
      title: No survival, so insure
      description: With no consideration there is nothing to escrow and no one to indemnify Beta. Accept no survival but ask Acme to cooperate with a buyer-side R&W policy.
      raised_looks_like: Accepts that representations will not survive and asks for cooperation with R&W insurance instead.
      delta: D04
      competencies: [merger_agreement]
      keywords: [survival, indemnity, R&W insurance, representation and warranty insurance, cooperate, 9.1]
  decision_points:
    - id: A7.D1
      title: Where Beta gives ground
      trigger: The associate proposes a trade to Simon.
      question: Which point should Beta give ground on to win the others?
      rationale_prompt: Why this trade, and how does it serve what Grace told you Beta needs?
      positions:
        - id: P1
          label: Drop the Corvane and landlord consents
          description: Keep the Halvorsen and Unity consent conditions and drop Corvane and the landlord.
        - id: P2
          label: Drop the remediation spending covenant
          description: Accept no spending commitment in exchange for FDA information and consultation rights.
        - id: P3
          label: Hold everything for now
          description: Hold all points and ask Simon which matter most to Acme's board.
  socratic_angles:
    - What Acme's board is protecting with each position, and whether Beta can get the same protection another way.

# ---------------------------------------------------------------- M8
- id: A8
  milestone: M8
  title: Work the closing checklist to closing
  deliverable: Status emails to Daniel and Nadia working each closing item, including BigBank's deliverables, to done or waived until the merger is effective.
  assigned_by: senior_associate
  feedback_from: senior_associate
  thread_key: closing
  expected_recipients: [senior_associate, lenders_counsel]
  competencies: [closing_mechanics, distressed_finance]
  completion: { kind: deliverable }
  approx_minutes: 90
  issues:
    - id: A8.I1
      tier: expected
      title: BigBank's documents release together at the effective time
      description: The forgiveness, lien releases, amended and restated credit agreement and Beta guaranty must be signed in advance and released together at the effective time, so nobody is bound unless everything closes.
      raised_looks_like: Proposes holding the BigBank documents in escrow and releasing them simultaneously when the certificate of merger is filed.
      competencies: [closing_mechanics, distressed_finance]
      keywords: [forgiveness, lien release, UCC-3, guaranty, simultaneous, escrow, release]
    - id: A8.I2
      tier: expected
      title: Filing the certificate of merger sets the effective time
      description: The merger becomes effective when the certificate of merger is filed with the Delaware Secretary of State (or at a later time it specifies). Everything else is keyed to that moment.
      raised_looks_like: Coordinates the filing of the certificate of merger and keys the other deliveries to the effective time.
      competencies: [closing_mechanics]
      keywords: [certificate of merger, Delaware, Secretary of State, effective time, filing]
    - id: A8.I3
      tier: strong
      title: Appraisal notice to non-consenting holders
      description: Holders who did not sign the written consent must get notice of appraisal rights under DGCL Section 262(d)(2), within 10 days after the effective time if not sent before.
      raised_looks_like: Puts the Section 262 appraisal notice on the checklist with its deadline.
      competencies: [corporate_approvals, closing_mechanics]
      keywords: [262, appraisal notice, 10 days, non-consenting, notice]
    - id: A8.I4
      tier: strong
      title: Consents obtained or waived
      description: Each consent in the closing condition (Halvorsen, Unity) must be in hand or expressly waived by Beta before closing.
      raised_looks_like: Reports the status of each required consent and asks Grace to decide on any waiver.
      competencies: [closing_mechanics]
      keywords: [consent, Halvorsen, Unity, waive, waiver, status]
  socratic_angles:
    - What happens if BigBank's documents are signed but the merger does not close that day.
