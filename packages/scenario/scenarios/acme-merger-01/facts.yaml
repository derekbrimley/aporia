# Canonical deal facts. Every document and every character must match this file.
# Characters see only the keys listed in their knowledge slice.
# DRAFT: the structure is Austin's hypothetical; the details are engineering placeholders.

# ---------------------------------------------------------------- parties
parties.target:
  type: party
  value: Acme Pharmaceuticals, Inc.
  aliases: [Acme, Acme Pharmaceuticals, the Company]
  note: Delaware corporation; privately held; specialty pharmaceutical company headquartered in Durham, North Carolina.
parties.target.business:
  type: text
  value: Develops and manufactures generic oncology injectables at a single leased manufacturing facility in Durham, North Carolina, and sells them to hospitals through group purchasing organizations and wholesalers.
parties.target.products:
  type: text
  value: Eleven FDA-approved abbreviated new drug applications (ANDAs) for generic oncology injectables, all held in Acme's name.
parties.target.anda_count:
  type: number
  value: 11
  unit: ANDAs
parties.target.employees:
  type: number
  value: 310
  unit: employees
parties.target.distress:
  type: text
  value: After FDA inspection findings at the Durham facility and a voluntary recall of one product lot, Acme lost three major customer contracts, breached the financial covenants in its credit agreement, and is operating under a forbearance agreement with BigBank. It is insolvent and will run out of cash within weeks.
parties.buyer:
  type: party
  value: Beta Pharma, Inc.
  aliases: [Beta, Beta Pharma, Parent]
  note: Delaware corporation; a larger generic and specialty pharmaceutical competitor with a stronger balance sheet.
parties.merger_sub:
  type: party
  value: Beta Merger Sub, Inc.
  aliases: [Merger Sub]
  note: Newly formed Delaware corporation, wholly owned by Beta, created only for the merger.
parties.lender:
  type: party
  value: BigBank, N.A.
  aliases: [BigBank, the Bank, Lender]
